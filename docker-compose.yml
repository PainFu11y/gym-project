services:


  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gym_project_docker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: java
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-network

  mongodb:
    image: mongo:7
    container_name: gym-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gym-network

  activemq:
    image: apache/activemq-classic:5.18.3
    container_name: gym-activemq
    ports:
      - "61616:61616"   # JMS / OpenWire
      - "8161:8161"     # Web console  →  http://localhost:8161  (admin / admin)
    healthcheck:
      # curl without -f so any HTTP response (incl. 401) means the broker is up
      test: ["CMD-SHELL", "curl -s --max-time 5 http://localhost:8161 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 10
    networks:
      - gym-network


  eureka-server:
    build:
      context: ./gym-eureka-server
    image: gym-eureka-server:latest
    container_name: gym-eureka-server
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - gym-network


  gym-main-service:
    build:
      context: ./Gym-project
    image: gym-main-service:latest
    container_name: gym-main-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - gym-network

  gym-report-service:
    build:
      context: ./gym-report-service
    image: gym-report-service:latest
    container_name: gym-report-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy
      activemq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - gym-network


networks:
  gym-network:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
