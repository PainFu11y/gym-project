# Print every Given / When / Then step to the console while tests run
cucumber.plugin=pretty, \
  html:build/cucumber-reports/gym-report-cucumber.html, \
  json:build/cucumber-reports/gym-report-cucumber.json

# summary line at the end even for passing tests
cucumber.publish.quiet=true

# Use the scenario title as the JUnit test name (readable in IDE / Gradle report)
cucumber.junit-platform.naming-strategy=long
